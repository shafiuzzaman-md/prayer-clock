<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prayer Clock</title>
  <style>
    :root {
      --bg-start: #eef2f7;
      --bg-end: #d9e2ec;
      --card-bg: #ffffff;
      --card-border: rgba(15, 23, 42, 0.06);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --label: #64748b;
      --prayer: #0f172a;
      --iqama-bg: #e2e8f0;
      --iqama-text: #334155;
      --countdown: #0e7490;
      --countdown-iqama: #b91c1c;
      --countdown-sunrise: #b45309;
      --next: #15803d;
      --schedule-bg: #f1f5f9;
      --schedule-text: #475569;
      --schedule-active-bg: #0f172a;
      --schedule-active-text: #fef3c7;
      --toggle-bg: rgba(255, 255, 255, 0.7);
      --toggle-text: #334155;
    }

    body.night {
      --bg-start: #1a0f0a;
      --bg-end: #0a0604;
      --card-bg: #1f130c;
      --card-border: rgba(255, 140, 40, 0.12);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      --label: #b08060;
      --prayer: #ffb774;
      --iqama-bg: #2e1d12;
      --iqama-text: #e6a86b;
      --countdown: #ff8855;
      --countdown-iqama: #ff6b4a;
      --countdown-sunrise: #ffb84a;
      --next: #d68a52;
      --schedule-bg: #2a1810;
      --schedule-text: #b08060;
      --schedule-active-bg: #4a2818;
      --schedule-active-text: #ffb774;
      --toggle-bg: rgba(40, 20, 10, 0.8);
      --toggle-text: #d99a55;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--prayer);
      transition: background 0.6s ease, color 0.6s ease;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 2.5vw, 40px);
      gap: clamp(14px, 2vw, 28px);
    }

    .card {
      width: 100%;
      max-width: min(1280px, 92vw);
    }
    .schedule {
      width: 100%;
      max-width: min(960px, 78vw);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: clamp(20px, 2vw, 32px);
      box-shadow: var(--shadow);
      padding: clamp(32px, 5vw, 80px) clamp(24px, 4vw, 64px);
      text-align: center;
      transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .headline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3.5vw, 64px);
      margin-bottom: clamp(20px, 2.4vw, 40px);
    }

    .label {
      font-size: clamp(0.9rem, 1.6vw, 1.6rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--label);
      font-weight: 700;
    }

    .prayer-name {
      font-size: clamp(3.2rem, 12vw, 12rem);
      font-weight: 800;
      color: var(--prayer);
      letter-spacing: -0.025em;
      line-height: 1;
      margin: 0;
      transition: color 0.6s ease;
    }

    .iqama-pill {
      display: inline-block;
      padding: clamp(8px, 0.9vw, 14px) clamp(18px, 2vw, 32px);
      border-radius: 999px;
      background: var(--iqama-bg);
      color: var(--iqama-text);
      font-size: clamp(1.1rem, 2.2vw, 2.4rem);
      font-weight: 700;
      transition: background 0.6s ease, color 0.6s ease;
    }
    .iqama-pill:empty { display: none; }

    .countdown {
      font-size: clamp(2rem, 6vw, 6rem);
      font-weight: 800;
      color: var(--countdown);
      margin: 0;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.015em;
      line-height: 1;
      transition: color 0.4s ease;
    }
    .countdown:empty { display: none; }
    .countdown.iqama { color: var(--countdown-iqama); }
    .countdown.sunrise { color: var(--countdown-sunrise); }

    .next {
      font-size: clamp(1.1rem, 2.2vw, 2.2rem);
      color: var(--next);
      font-weight: 700;
      transition: color 0.6s ease;
    }

    .sun-times {
      display: flex;
      justify-content: center;
      gap: clamp(20px, 3vw, 48px);
      margin-top: clamp(12px, 1.4vw, 24px);
      font-size: clamp(0.95rem, 1.5vw, 1.4rem);
      font-weight: 600;
      color: var(--label);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
      transition: color 0.6s ease;
    }
    .sun-times:empty { display: none; }

    .schedule {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(6px, 0.8vw, 14px);
      list-style: none;
      padding: clamp(10px, 1.2vw, 20px);
      margin: 0;
      background: var(--schedule-bg);
      border-radius: clamp(16px, 1.6vw, 24px);
      transition: background 0.6s ease;
    }
    .schedule li {
      padding: clamp(12px, 1.4vw, 24px) clamp(4px, 0.6vw, 10px);
      border-radius: clamp(10px, 1vw, 16px);
      text-align: center;
      color: var(--schedule-text);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .schedule li.active {
      background: var(--schedule-active-bg);
      color: var(--schedule-active-text);
    }
    .schedule .sname {
      font-size: clamp(0.7rem, 1.3vw, 1.4rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      opacity: 0.9;
    }
    .schedule .stime {
      font-size: clamp(1rem, 2vw, 2.2rem);
      font-weight: 700;
      margin-top: clamp(2px, 0.4vw, 8px);
      font-variant-numeric: tabular-nums;
    }
    .schedule .siqama {
      font-size: clamp(0.7rem, 1.2vw, 1.3rem);
      font-weight: 600;
      margin-top: 2px;
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }

    .mode-toggle {
      position: fixed;
      top: clamp(12px, 1.4vw, 24px);
      right: clamp(12px, 1.4vw, 24px);
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: clamp(8px, 0.9vw, 14px) clamp(14px, 1.6vw, 24px);
      font-size: clamp(0.85rem, 1.1vw, 1.2rem);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      font-family: inherit;
      z-index: 10;
    }
    .mode-toggle:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <button class="mode-toggle" id="modeToggle" type="button">🌗 Auto</button>

  <div class="app">
    <main class="card">
      <div class="headline">
        <div class="label" id="cardLabel">Now</div>
        <div class="prayer-name" id="currentPrayer">Loading…</div>
        <div class="countdown" id="timeLeft"></div>
        <div class="iqama-pill" id="iqama"></div>
      </div>
      <div class="next" id="nextPrayerTime"></div>
      <div class="sun-times" id="sunTimes"></div>
    </main>
    <ul class="schedule" id="schedule"></ul>
  </div>


  <script>
// Prayer times fetched from arrahman.azurewebsites.net
let cachedPrayerData = null;
let cachedSunrise = null;
let lastFetchDate = null;
let lastRenderKey = null;
let wakeLock = null;

function parsePrayerTimesHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  const prayerNames = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const athan = {};
  const iqama = {};

  // New layout: columns per prayer with data-prayer on th/td elements
  // Header row has <th data-prayer="Fajr">, body rows have <td data-prayer="Fajr">
  const bodyRows = doc.querySelectorAll('table.prayer-times-table tbody tr');
  if (bodyRows.length >= 2) {
    const athanRow = bodyRows[0]; // first row is Athan
    const iqamaRow = bodyRows[1]; // second row is Iqama
    for (const pn of prayerNames) {
      const athanCell = athanRow.querySelector(`td[data-prayer="${pn.charAt(0).toUpperCase() + pn.slice(1)}"]`);
      const iqamaCell = iqamaRow.querySelector(`td[data-prayer="${pn.charAt(0).toUpperCase() + pn.slice(1)}"]`);
      if (athanCell) athan[pn] = athanCell.textContent.trim();
      if (iqamaCell) iqama[pn] = iqamaCell.textContent.trim();
    }
  }

  // Fallback: try matching any td with data-prayer in all rows
  if (!athan.fajr) {
    const allRows = doc.querySelectorAll('table tbody tr');
    for (const row of allRows) {
      const label = row.querySelector('td:first-child');
      if (!label) continue;
      const labelText = label.textContent.trim().toLowerCase();
      for (const pn of prayerNames) {
        const cell = row.querySelector(`td[data-prayer="${pn.charAt(0).toUpperCase() + pn.slice(1)}"]`);
        if (cell) {
          if (labelText.includes('athan')) athan[pn] = cell.textContent.trim();
          else if (labelText.includes('iqama')) iqama[pn] = cell.textContent.trim();
        }
      }
    }
  }

  // Extract sunrise from span with title="Sunrise" or class="sun-time"
  let sunrise = null;
  const sunriseSpan = doc.querySelector('span[title="Sunrise"]');
  if (sunriseSpan) {
    const text = sunriseSpan.textContent.trim();
    const match = text.match(/(\d{1,2}:\d{2}\s*[AP]M)/i);
    if (match) sunrise = match[1];
  }

  if (!athan.fajr || !athan.dhuhr || !athan.asr || !athan.maghrib || !athan.isha) {
    return null;
  }

  // Fix known data issues: Fajr iqama should always be AM
  if (iqama.fajr) {
    iqama.fajr = iqama.fajr.replace(/PM$/i, 'AM');
  }

  return { athan, iqama, sunrise };
}

async function fetchPrayerTimesFromWeb() {
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // Don't re-fetch if we already have today's data
  if (cachedPrayerData && lastFetchDate === todayStr) return cachedPrayerData;

  const targetUrl = 'https://arrahman.azurewebsites.net/';
  let html = null;

  // Helper: fetch with timeout (AbortSignal.timeout not available everywhere)
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      return res;
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  // CORS proxies — codetabs returns the raw page, allorigins wraps in {contents}.
  const proxies = [
    { name: "codetabs", url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(targetUrl)}`, extract: async (res) => res.text() },
    { name: "allorigins", url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`, extract: async (res) => (await res.json()).contents }
  ];

  for (const proxy of proxies) {
    try {
      console.log(`Fetching prayer times via ${proxy.name} proxy...`);
      const res = await fetchWithTimeout(proxy.url, 30000);
      if (!res.ok) continue;
      const body = await proxy.extract(res);
      if (body && body.includes('Fajr') && body.includes('Isha')) {
        html = body;
        console.log(`${proxy.name} proxy succeeded`);
        break;
      }
    } catch (e) {
      console.warn(`${proxy.name} proxy failed:`, e.message);
    }
  }

  if (!html) {
    console.error("Could not fetch prayer times from any source");
    // Try localStorage fallback — only if it's from today.
    const saved = localStorage.getItem('prayerTimesCache');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.prayerData && data.prayerData.date === todayStr) {
        cachedPrayerData = data.prayerData;
        cachedSunrise = data.sunrise;
        lastFetchDate = cachedPrayerData.date;
        console.log("Using cached prayer times from localStorage");
        return cachedPrayerData;
      }
      console.warn(`Discarding stale localStorage cache from ${data.prayerData && data.prayerData.date}`);
    }
    return null;
  }

  const parsed = parsePrayerTimesHTML(html);
  if (!parsed) {
    console.error("Failed to parse prayer times from HTML");
    return null;
  }

  cachedPrayerData = { athan: parsed.athan, iqama: parsed.iqama, date: todayStr };
  if (parsed.sunrise) cachedSunrise = parsed.sunrise;
  lastFetchDate = todayStr;

  // Save to localStorage for offline fallback
  localStorage.setItem('prayerTimesCache', JSON.stringify({
    prayerData: cachedPrayerData,
    sunrise: cachedSunrise
  }));

  console.log("Prayer times loaded:", cachedPrayerData, "Sunrise:", cachedSunrise);
  return cachedPrayerData;
}

    function parseTime(dateStr, timeStr) {
      const [time, modifier] = timeStr.split(" ");
      let [hours, minutes] = time.split(":").map(Number);
      if (modifier === "PM" && hours !== 12) hours += 12;
      if (modifier === "AM" && hours === 12) hours = 0;
      return new Date(`${dateStr}T${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:00`);
    }

    function getTodayPrayerTimes() {
      if (!cachedPrayerData) return null;
      // Guard against the date rolling over before we've refreshed the cache.
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      if (cachedPrayerData.date !== todayStr) return null;
      const data = cachedPrayerData;
      return {
        date: data.date,
        fajr: data.athan.fajr,
        sunrise: cachedSunrise || "6:00 AM",
        dhuhr: data.athan.dhuhr,
        asr: data.athan.asr,
        maghrib: data.athan.maghrib,
        isha: data.athan.isha,
        iqama: data.iqama
      };
    }

    function getCurrentPrayer(prayers, now) {
  const fajrTime    = parseTime(prayers.date, prayers.fajr);
  const sunriseTime = parseTime(prayers.date, prayers.sunrise);
  const dhuhrTime   = parseTime(prayers.date, prayers.dhuhr);
  const asrTime     = parseTime(prayers.date, prayers.asr);
  const maghribTime = parseTime(prayers.date, prayers.maghrib);
  const ishaTime    = parseTime(prayers.date, prayers.isha);

  // Tomorrow's Fajr (today's Fajr time used as estimate). Build via date parts to
  // avoid `new Date("YYYY-MM-DD")` parsing as UTC.
  const [py, pm, pd] = prayers.date.split('-').map(Number);
  const tomorrow = new Date(py, pm - 1, pd + 1);
  const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,'0')}-${String(tomorrow.getDate()).padStart(2,'0')}`;
  const fajrNextDay = parseTime(tomorrowStr, prayers.fajr);

  // Window-end times (when each prayer's valid time runs out)
  const sunriseEnd  = new Date(sunriseTime.getTime() + 20 * 60 * 1000);     // sunrise display window
  const asrEnd      = new Date(maghribTime.getTime() - 20 * 60 * 1000);     // Asr ends 20m before sunset
  const ishaEnd     = new Date(maghribTime.getTime() + (fajrNextDay - maghribTime) / 2); // midpoint of the night

  const schedule = [
    { name: "Fajr",    time: fajrTime,    end: sunriseTime, iqama: prayers.iqama.fajr },
    { name: "Sunrise", time: sunriseTime, end: sunriseEnd,  iqama: "N/A" },
    { name: "Dhuhr",   time: dhuhrTime,   end: asrTime,     iqama: prayers.iqama.dhuhr },
    { name: "Asr",     time: asrTime,     end: asrEnd,      iqama: prayers.iqama.asr },
    { name: "Maghrib", time: maghribTime, end: ishaTime,    iqama: (prayers.iqama.maghrib === "At Sunset") ? prayers.maghrib : prayers.iqama.maghrib },
    { name: "Isha",    time: ishaTime,    end: ishaEnd,     iqama: prayers.iqama.isha }
  ];

  // Active prayer = the one whose [time, end) window contains `now`.
  let current = null;
  for (const entry of schedule) {
    if (now >= entry.time && now < entry.end) { current = entry; break; }
  }

  // Next upcoming prayer (today's schedule, else tomorrow's Fajr).
  let next = schedule.find(e => e.time > now);
  if (!next) {
    next = { name: "Fajr", time: fajrNextDay, end: null, iqama: prayers.iqama.fajr };
  }

  return { current, next, schedule };
}

    function formatTimeLeft(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function formatMinutes(seconds) {
      if (seconds <= 0) return "now";
      if (seconds < 60) return "1 min";

      const mins = Math.ceil(seconds / 60);
      const h = Math.floor(mins / 60);
      const m = mins % 60;

      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }



  function formatClockTime(date) {
    return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function hasIqama(prayer) {
    return prayer && prayer.iqama && prayer.iqama !== "N/A" && prayer.iqama !== "-";
  }

  function describeNext(next, now) {
    if (!next) return "";
    const secs = Math.floor((next.time - now) / 1000);
    const parts = [formatClockTime(next.time)];
    if (hasIqama(next)) parts.push(`Iqama: ${next.iqama}`);
    return `${next.name} in ${formatMinutes(secs)} (${parts.join(", ")})`;
  }

  function renderSchedule(schedule, current) {
    const ul = document.getElementById("schedule");
    const items = schedule.filter(s => s.name !== "Sunrise");
    ul.innerHTML = items.map(s => {
      const active = current && current.name === s.name ? "active" : "";
      const athanStr = formatClockTime(s.time);
      const showIqama = hasIqama(s) && s.iqama !== athanStr;
      let sub = "";
      if (showIqama) sub = `<div class="siqama">Iqama ${s.iqama}</div>`;
      else if (s.name === "Maghrib") sub = `<div class="siqama">Sunset</div>`;
      return `<li class="${active}"><div class="sname">${s.name}</div><div class="stime">${athanStr}</div>${sub}</li>`;
    }).join("");

    const sunrise = schedule.find(s => s.name === "Sunrise");
    const sunset = schedule.find(s => s.name === "Maghrib");
    const sunEl = document.getElementById("sunTimes");
    if (sunEl) {
      const parts = [];
      if (sunrise) parts.push(`<span>☀ Sunrise ${formatClockTime(sunrise.time)}</span>`);
      if (sunset) parts.push(`<span>🌅 Sunset ${formatClockTime(sunset.time)}</span>`);
      sunEl.innerHTML = parts.join("");
    }
  }

  // ---- Night-light mode ------------------------------------------------
  let userMode = localStorage.getItem("prayerClockMode") || "auto";
  const MODE_LABELS = { auto: "🌗 Auto", day: "☀️ Day", night: "🌙 Night" };

  function isNightTime(prayers, now) {
    if (!prayers) return false;
    const sunrise = parseTime(prayers.date, prayers.sunrise);
    const maghrib = parseTime(prayers.date, prayers.maghrib);
    return now >= maghrib || now < sunrise;
  }

  function applyMode(prayers, now) {
    const night = userMode === "auto" ? isNightTime(prayers, now) : userMode === "night";
    document.body.classList.toggle("night", night);
    document.getElementById("modeToggle").innerText = MODE_LABELS[userMode];
  }

  document.getElementById("modeToggle").addEventListener("click", () => {
    const order = ["auto", "day", "night"];
    userMode = order[(order.indexOf(userMode) + 1) % order.length];
    localStorage.setItem("prayerClockMode", userMode);
    update();
  });

  // ---- Main render -----------------------------------------------------
  function update() {
    const now = new Date();
    const todayPrayers = getTodayPrayerTimes();

    applyMode(todayPrayers, now);

    const labelEl = document.getElementById("cardLabel");
    const currentPrayerEl = document.getElementById("currentPrayer");
    const iqamaEl = document.getElementById("iqama");
    const nextPrayerEl = document.getElementById("nextPrayerTime");
    const timeLeftEl = document.getElementById("timeLeft");
    timeLeftEl.className = "countdown";
    iqamaEl.innerText = "";

    if (!todayPrayers) {
      labelEl.innerText = "—";
      currentPrayerEl.innerText = "No data";
      nextPrayerEl.innerText = "";
      timeLeftEl.innerText = "Reconnecting…";
      return;
    }

    const result = getCurrentPrayer(todayPrayers, now);
    const current = result.current;
    const next = result.next;

    // Only rebuild the schedule strip when the active prayer or day changes.
    const renderKey = `${todayPrayers.date}|${current ? current.name : ''}`;
    if (renderKey !== lastRenderKey) {
      renderSchedule(result.schedule, current);
      lastRenderKey = renderKey;
    }

    // Headline prayer: current if active, otherwise the upcoming one.
    const headline = current || next;
    if (headline) {
      labelEl.innerText = current ? "Now" : "Up Next";
      currentPrayerEl.innerText = headline.name;
      if (hasIqama(headline)) {
        const iqamaTime = parseTime(todayPrayers.date, headline.iqama);
        if (now < iqamaTime) {
          iqamaEl.innerText = `Iqama ${headline.iqama}`;
        }
      }
    } else {
      labelEl.innerText = "—";
      currentPrayerEl.innerText = "—";
    }

    // Countdown
    let message = "";
    timeLeftEl.classList.remove("iqama", "sunrise");

    if (current && current.name === "Sunrise") {
      message = `Sunrise`;
      timeLeftEl.classList.add("sunrise");
    } else if (current && hasIqama(current)) {
      const iqamaTime = parseTime(todayPrayers.date, current.iqama);
      const secsToIqama = Math.floor((iqamaTime - now) / 1000);
      if (secsToIqama > 0) {
        message = `Iqama in ${formatMinutes(secsToIqama)}`;
        timeLeftEl.classList.add("iqama");
      } else if (current.end) {
        const secsLeft = Math.floor((current.end - now) / 1000);
        message = `${formatMinutes(secsLeft)} left`;
      }
    } else if (current && current.end) {
      const secsLeft = Math.floor((current.end - now) / 1000);
      message = `${formatMinutes(secsLeft)} left`;
    } else if (next) {
      const secsToNext = Math.floor((next.time - now) / 1000);
      message = `in ${formatMinutes(secsToNext)}`;
    }

    timeLeftEl.innerText = message;

    // Detail line — only show when meaningful (i.e. a different prayer is upcoming
    // or there's extra info beyond what the headline conveys).
    if (current && next && current.name !== next.name) {
      nextPrayerEl.innerText = describeNext(next, now);
    } else if (!current && next) {
      const parts = [formatClockTime(next.time)];
      if (hasIqama(next)) parts.push(`Iqama: ${next.iqama}`);
      nextPrayerEl.innerText = parts.join(" • ");
    } else {
      nextPrayerEl.innerText = "";
    }
  }

  // ---- Keep-awake + lifecycle -----------------------------------------
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      if (wakeLock) await wakeLock.release().catch(() => {});
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
      console.warn("WakeLock request failed:", e.message);
    }
  }

  function scheduleMidnightRefresh() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 30);
    setTimeout(async () => {
      await fetchPrayerTimesFromWeb();
      update();
      scheduleMidnightRefresh();
    }, next - now);
  }

  // ---- Init ------------------------------------------------------------
  async function init() {
    applyMode(null, new Date()); // set toggle label before data arrives
    await fetchPrayerTimesFromWeb();
    update();
    setInterval(update, 1000);
    setInterval(fetchPrayerTimesFromWeb, 30 * 60 * 1000);
    requestWakeLock();
    scheduleMidnightRefresh();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
        fetchPrayerTimesFromWeb().then(() => update());
      }
    });
  }
  init();


  </script>
