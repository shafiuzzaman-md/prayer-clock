#currentPrayer,

    function parseTime(dateStr, timeStr) {
      const [time, modifier] = timeStr.split(" ");
      let [hours, minutes] = time.split(":").map(Number);
      if (modifier === "PM" && hours !== 12) hours += 12;
      if (modifier === "AM" && hours === 12) hours = 0;
      return new Date(`${dateStr}T${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:00`);
    }

    function getTodayPrayerTimes() {
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const raw = prayerTimes.find(p => p.date === todayStr);
      const day = now.getDate();
      const iqama = day <= 15 ? iqama_1_15 : iqama_16_30;
      if (!raw) return null;
      return {
        date: raw.date,
        fajr: raw.fajr,
        sunrise: raw.sunrise,
        dhuhr: raw.dhuhr,
        asr: raw.asr,
        maghrib: raw.maghrib,
        isha: raw.isha,
        iqama
      };
    }

    function getCurrentPrayer(prayers, now) {
  const schedule = [
    { name: "Fajr", time: parseTime(prayers.date, prayers.fajr), iqama: prayers.iqama.fajr },
    { name: "Sunrise", time: parseTime(prayers.date, prayers.sunrise), iqama: "N/A" },
    { name: "Dhuhr", time: parseTime(prayers.date, prayers.dhuhr), iqama: prayers.iqama.dhuhr },
    { name: "Asr", time: parseTime(prayers.date, prayers.asr), iqama: prayers.iqama.asr },
    { name: "Maghrib",  time: parseTime(prayers.date, prayers.maghrib), iqama: (prayers.iqama.maghrib === "At Sunset") ? prayers.maghrib : prayers.iqama.maghrib },
    { name: "Isha", time: parseTime(prayers.date, prayers.isha), iqama: prayers.iqama.isha }
  ];

  for (let i = 0; i < schedule.length - 1; i++) {
    const curr = schedule[i];
    const next = schedule[i + 1];
    if (now >= curr.time && now < next.time) {

      // Special logic to show Sunrise only for 20 minutes
      if (curr.name === "Sunrise") {
        const sunriseEnd = new Date(curr.time.getTime() + 20 * 60 * 1000);
        if (now <= sunriseEnd) {
          return {
            current: curr,
            next,
            schedule,
            timeLeft: Math.floor((sunriseEnd - now) / 1000)
          };
        } else {
          // After 20 minutes of sunrise, skip to next
          return {
            current: null,
            next,
            schedule,
            timeLeft: Math.floor((next.time - now) / 1000)
          };
        }
      }

      return {
        current: curr,
        next,
        schedule,
        timeLeft: Math.floor((next.time - now) / 1000)
      };
    }
  }

  // After Isha — set next to tomorrow's Fajr
  const isha = schedule[schedule.length - 1];
  if (now >= isha.time) {
    const tomorrow = new Date(prayers.date);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split("T")[0];
    const tomorrowPrayer = prayerTimes.find(p => p.date === tomorrowStr);
    const tomorrowDay = tomorrow.getDate();
    const iqama = tomorrowDay <= 15 ? iqama_1_15 : iqama_16_30;

    if (tomorrowPrayer) {
      const fajrTime = parseTime(tomorrowPrayer.date, tomorrowPrayer.fajr);
      return {
        current: isha,
        next: { name: "Fajr", time: fajrTime, iqama: iqama.fajr },
        schedule,
        timeLeft: Math.floor((fajrTime - now) / 1000)
      };
    }
  }

  // Before Fajr
  const fajr = schedule[0];
  return {
    current: null,
    next: fajr,
    schedule,
    timeLeft: Math.floor((fajr.time - now) / 1000)
  };
}

    function formatTimeLeft(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function formatMinutes(seconds) {
      if (seconds < 60) return "1 minute";

      const mins = Math.ceil(seconds / 60);
      const h = Math.floor(mins / 60);
      const m = mins % 60;

      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }



  function update() {
    const now = new Date();
    const todayPrayers = getTodayPrayerTimes();
    if (!todayPrayers) {
      document.getElementById("currentPrayer").innerText = "No data for today.";
      return;
    }

    document.getElementById("currentTime").innerText = now.toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    });

    document.getElementById("currentDate").innerText = now.toLocaleDateString(undefined, {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });

    const { current, next, timeLeft } = getCurrentPrayer(todayPrayers, now);
    const currentPrayerEl = document.getElementById("currentPrayer");
    const nextPrayerEl = document.getElementById("nextPrayerTime");

    let showCurrentPrayer = false;

    if (current && current.name === "Sunrise") {
      showCurrentPrayer = true; // Always show sunrise during its 20 minute window
    } else if (current && current.iqama && current.iqama !== "N/A" && current.iqama !== "-") {
      const iqamaTime = parseTime(todayPrayers.date, current.iqama);
      const iqamaEnd = new Date(iqamaTime.getTime() + 20 * 60 * 1000);
      showCurrentPrayer = now < iqamaEnd;
    }

    if (timeLeft <= 0) {
      showCurrentPrayer = true;
    }

    if (showCurrentPrayer && current) {
      currentPrayerEl.style.display = "block";
      const label = current.iqama && current.iqama !== "N/A" && current.iqama !== "-" ? ` (Iqama: ${current.iqama})` : "";
      currentPrayerEl.innerText = `${current.name}${label}`;
      nextPrayerEl.style.display = "none";
    } else if (next && next.name !== "Sunrise") {
      currentPrayerEl.style.display = "none";
      nextPrayerEl.style.display = "block";
      const iqamaNext = (next.iqama && next.iqama !== "N/A" && next.iqama !== "-") ? ` (Iqama: ${next.iqama})` : "";
      nextPrayerEl.innerText = `${next.name}${iqamaNext}`;
    } else {
      currentPrayerEl.style.display = "none";
      nextPrayerEl.style.display = "none";
    }

    const timeLeftEl = document.getElementById("timeLeft");
    let message = "";
    timeLeftEl.className = ""; // clear previous styles
    if (current && current.name === "Fajr") {
      const iqamaTime = parseTime(todayPrayers.date, current.iqama);
      const secsToIqama = Math.floor((iqamaTime - now) / 1000);
      if (secsToIqama > 0) {
        message = `Fajr iqama in ${formatMinutes(secsToIqama)}`;
        timeLeftEl.classList.add("iqama");
      } else {
        const sunriseTime = parseTime(todayPrayers.date, todayPrayers.sunrise);
        const secsToSunrise = Math.floor((sunriseTime - now) / 1000);
        if (secsToSunrise > 0) {
          message = `Sunrise in ${formatMinutes(secsToSunrise)}`;
          timeLeftEl.classList.add("iqama");
        } else if (secsToSunrise > -1200) {
          message = `Sunrise Time`;
          timeLeftEl.classList.add("sunrise");
        }
      }
    } else if (current && current.name === "Sunrise") {
      // Already covered by sunrise logic
      const sunriseEnd = new Date(parseTime(todayPrayers.date, todayPrayers.sunrise).getTime() + 20 * 60 * 1000);
      const secsLeft = Math.floor((sunriseEnd - now) / 1000);
      if (secsLeft > 0) {
        message = `Sunrise Time`;
        timeLeftEl.classList.add("sunrise");
      } else {
        // Already passed 20 mins after sunrise
        const secsToNext = Math.floor((next.time - now) / 1000);
        message = `${next.name} in ${formatMinutes(secsToNext)}`;
        timeLeftEl.classList.add("countdown");
      }
    } else if (current && current.iqama && current.iqama !== "N/A" && current.iqama !== "-") {
      const iqamaTime = parseTime(todayPrayers.date, current.iqama);
      const secsToIqama = Math.floor((iqamaTime - now) / 1000);
      if (secsToIqama > 0) {
        message = `${current.name} iqama in ${formatMinutes(secsToIqama)}`;
        timeLeftEl.classList.add("iqama");
      } else {
        const secsToNext = Math.floor((next.time - now) / 1000);
        message = `${next.name} in ${formatMinutes(secsToNext)}`;
        timeLeftEl.classList.add("countdown");
      }
    } else if (next) {
      // Fallback — before Fajr or after Isha
      const secsToNext = Math.floor((next.time - now) / 1000);
      message = `${next.name} in ${formatMinutes(secsToNext)}`;
      timeLeftEl.classList.add("countdown");
    } else {
      message = ""; // nothing to show
    }

    timeLeftEl.innerText = message;


  }


  async function fetchTemperature(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    const tempC = data.current_weather.temperature;
    const tempF = (tempC * 9/5) + 32;
    document.getElementById("temperature").innerText = `🌡 ${tempC.toFixed(1)}°C / ${tempF.toFixed(1)}°F`;;
  } catch (err) {
    console.error("Temperature fetch failed", err);
    document.getElementById("temperature").innerText = "🌡 N/A";
  }
}
  
  async function fetchLocationName(lat, lon) {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;

    try {
      const res = await fetch(url, { headers: { 'User-Agent': 'PrayerClockApp/1.0' } });
      const data = await res.json();
      const name = data.address.city || data.address.town || data.address.village || data.address.state || "Your area";
      document.getElementById("locationName").innerText = `📍 ${name}`;
    } catch (err) {
      console.warn("Location name fetch failed", err);
      document.getElementById("locationName").innerText = "";
    }
  }



    setInterval(update, 1000);
    update();
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          fetchTemperature(latitude, longitude);
          fetchLocationName(latitude, longitude);
          setInterval(() => fetchTemperature(latitude, longitude), 10 * 60 * 1000);
        },
        (error) => {
          console.warn("Geolocation failed, using default location.", error);
          fetchTemperature(40.7128, -74.0060);
          fetchLocationName(40.7128, -74.0060);
          setInterval(() => fetchTemperature(40.7128, -74.0060), 10 * 60 * 1000);
        }
      );
    } else {
      console.warn("Geolocation not supported, using default location.");
      fetchTemperature(40.7128, -74.0060);
      fetchLocationName(40.7128, -74.0060);
      setInterval(() => fetchTemperature(40.7128, -74.0060), 10 * 60 * 1000);
    }
